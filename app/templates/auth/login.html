{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card form-card">
  <h1>Entrar</h1>
  <form method="post">
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button class="btn btn-bloco" type="submit">Entrar</button>
  </form>
  <p class="nota">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
